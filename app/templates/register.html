<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro – Tech Interview AI</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">

    <div style="text-align:center;margin-bottom:2rem;">
      <div class="navbar-brand" style="font-size:1.4rem;justify-content:center;margin-bottom:0.4rem;">
        Tech Interview AI
      </div>
      <p style="color:var(--text-muted);font-size:0.9rem;">Crea tu cuenta gratuita</p>
    </div>

    {% if error %}
    <div class="alert alert-error" style="margin-bottom:1.25rem;">{{ error }}</div>
    {% endif %}

    <form method="post" action="/register">
      <div class="form-group">
        <label>
          Usuario
          <span style="color:var(--text-muted);font-weight:400;font-size:0.78rem;">(mín. 3 caracteres)</span>
        </label>
        <input type="text" name="username" placeholder="tu_usuario" required minlength="3" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" name="email" placeholder="tu@email.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>
          Contraseña
          <span style="color:var(--text-muted);font-weight:400;font-size:0.78rem;">(mín. 6 caracteres)</span>
        </label>
        <input type="password" name="password" placeholder="••••••" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.75rem;">
        Crear cuenta
      </button>
    </form>

    <p style="text-align:center;margin-top:1.5rem;font-size:0.88rem;color:var(--text-muted);">
      ¿Ya tienes cuenta?
      <a href="/login" style="color:var(--accent);">Inicia sesión</a>
    </p>

  </div>
</div>
</body>
</html>
